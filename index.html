    <!-- Structured Data — FAQ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How much can I claim for a delayed or cancelled flight?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Under EU261 and UK261, compensation ranges from €250 / £220 for short-haul (under 1,500 km) up to €600 / £520 for long-haul (over 3,500 km, 4+ hour arrival delay). For over 3,500 km flights with a 3–4 hour delay, compensation is €300 / £260. Under Israeli Aviation Services Law, compensation is ₪1,530 to ₪3,670 (2026 indexed amounts). These are fixed statutory amounts unrelated to ticket price."
          }
        },
        {
          "@type": "Question",
          "name": "Which flights qualify for EU261 compensation?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "EU261 applies to any flight departing from an EU airport on any airline, and to flights arriving in the EU operated by an EU-based carrier. UK261 covers flights departing UK airports, flights arriving in the UK on a UK or EU airline, and flights arriving in the EU on a UK airline."
          }
        },
        {
          "@type": "Question",
          "name": "How far back can I claim flight compensation?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "6 years in England and Wales, 5 years in Scotland and France, 4 years in Israel, and 3 years in most EU countries from the date of the disrupted flight. Flights from 2021 onward are very likely still within time."
          }
        },
        {
          "@type": "Question",
          "name": "What does no win, no fee mean for flight compensation?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You never pay anything upfront or out of pocket. ClaimVelo deducts its 30% success fee only from the compensation recovered. If we lose your case, you owe us absolutely nothing — ever."
          }
        },
        {
          "@type": "Question",
          "name": "What flights qualify for compensation under EU261?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Flights departing any EU airport regardless of airline, or flights arriving in the EU operated by an EU carrier. You may claim if your flight was delayed 3+ hours at the final destination, cancelled with less than 14 days' notice, or you were denied boarding due to overbooking."
          }
        },
        {
          "@type": "Question",
          "name": "How long does a flight compensation claim take?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Most airlines settle within 4–12 weeks of ClaimVelo's formal demand. If an airline disputes the claim, escalation to enforcement authorities or court can add 2–6 months. ClaimVelo handles everything — you just wait for payment."
          }
        },
        {
          "@type": "Question",
          "name": "Can airlines refuse to pay by claiming extraordinary circumstances?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Airlines misuse this defence regularly. Under EU261 and UK261, extraordinary circumstances are narrowly defined. Technical faults and crew shortages do not qualify. ClaimVelo challenges this excuse in the majority of contested cases and succeeds."
          }
        },
        {
          "@type": "Question",
          "name": "What documents do I need to make a flight compensation claim?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "At minimum: your booking confirmation or e-ticket and the names of all passengers claiming. Boarding passes and delay notifications help but are not required. The ClaimVelo submission takes under 2 minutes."
          }
        },
        {
          "@type": "Question",
          "name": "When am I entitled to meals and hotel under EU261?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Under EU261 and UK261, the Right to Care threshold depends on flight distance: 2 hours for flights under 1,500 km, 3 hours for 1,500–3,500 km, and 4 hours for over 3,500 km. Under Israeli law, a departure delay of 2 hours or more triggers the right to food, beverages, and communication services."
          }
        },
        {
          "@type": "Question",
          "name": "What are my rights if my flight to the US is cancelled?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Under US DOT rules, if a flight to, from, or within the United States is cancelled or significantly changed and you reject the alternative offered, you are generally entitled to an automatic refund in your original form of payment. For involuntary denied boarding on flights departing the US, separate compensation rules apply based on the one-way fare and arrival delay."
          }
        }
      ]
    }
    </script>
