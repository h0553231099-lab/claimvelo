    <!--
      Per-page <title>, <meta name="description">, <link rel="canonical">,
      and <meta name="robots"> are injected by react-helmet-async (SEO.tsx)
      at runtime and baked into each pre-rendered HTML file at build time by
      vite-plugin-prerender. The fallback default below covers the shell only.
    -->
    <title>ClaimVelo — Claim Up to €600 for Delayed or Cancelled Flights. No Win, No Fee.</title>

    <meta name="keywords" content="flight compensation, EU261, UK261, delayed flight claim, cancelled flight compensation, denied boarding, passenger rights, no win no fee, flight delay refund, flight cancellation claim, aviation law" />

    <!-- Google Search Console verification -->
    <meta name="google-site-verification" content="hID1uCcjhUqtdGh7MA4QCQPrGxsK8zu_UBEseuZqXxQ" />

    <!-- Open Graph — home-page fallback (react-helmet-async overrides per page) -->
    <meta property="og:type"         content="website" />
    <meta property="og:url"          content="https://claimvelo.com/" />
    <meta property="og:title"        content="ClaimVelo — Get Up to €600 for Your Disrupted Flight" />
    <meta property="og:description"  content="Delayed, cancelled, or denied boarding? Claim up to €600 per passenger. Free check. No win, no fee. EU261 · UK261 · Israeli law." />
    <meta property="og:image"        content="https://claimvelo.com/images/og-cover.svg" />
    <meta property="og:image:type"   content="image/svg+xml" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt"    content="ClaimVelo — Claim up to €600 for delayed or cancelled flights" />
    <meta property="og:site_name"    content="ClaimVelo" />
    <meta property="og:locale"       content="en_GB" />

    <!-- Twitter Card — home-page fallback -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:site"        content="@ClaimVeloPro" />
    <meta name="twitter:title"       content="ClaimVelo — Get Up to €600 for Your Disrupted Flight" />
    <meta name="twitter:description" content="Delayed, cancelled, or denied boarding? Claim up to €600. Free check. No win, no fee." />
    <meta name="twitter:image"       content="https://claimvelo.com/images/og-cover.svg" />
    <meta name="twitter:image:alt"   content="ClaimVelo — Claim up to €600 for delayed or cancelled flights" />

    <!-- Structured Data — Organization / LegalService -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LegalService",
      "name": "ClaimVelo",
      "alternateName": "ClaimVelo",
      "url": "https://claimvelo.com",
      "logo": {
        "@type": "ImageObject",
        "url": "https://claimvelo.com/images/logo.svg",
        "width": 512,
        "height": 512
      },
      "image": {
        "@type": "ImageObject",
        "url": "https://claimvelo.com/images/og-cover.svg",
        "width": 1200,
        "height": 630
      },
      "description": "Flight compensation specialists helping passengers claim up to €600 for delays, cancellations, and denied boarding under EU261, UK261, and Israeli aviation law. No win, no fee.",
      "slogan": "No Win, No Fee — We Fight the Airlines So You Don't Have To",
      "areaServed": [
        { "@type": "Place", "name": "European Union" },
        { "@type": "Place", "name": "United Kingdom" },
        { "@type": "Place", "name": "Israel" },
        { "@type": "Place", "name": "United States" }
      ],
      "priceRange": "Free eligibility check — 30% commission only on successful claims",
      "email": "info@claimvelo.com",
      "foundingDate": "2019",
      "numberOfEmployees": { "@type": "QuantitativeValue", "minValue": 10, "maxValue": 50 },
      "knowsAbout": ["EU Regulation 261/2004", "UK261", "Israeli Aviation Services Law", "Passenger Rights", "Flight Compensation"],
      "sameAs": []
    }
    </script>

    <!-- Structured Data — Service -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Service",
      "serviceType": "Flight Compensation Claim Service",
      "name": "ClaimVelo — Flight Compensation",
      "provider": { "@type": "LegalService", "name": "ClaimVelo", "url": "https://claimvelo.com" },
      "description": "We handle your entire flight compensation claim — from eligibility check to payment. EU261, UK261, and Israeli law. No win, no fee.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "EUR",
        "description": "Free eligibility check. 30% commission deducted only from compensation recovered.",
        "availability": "https://schema.org/InStock"
      },
      "areaServed": ["EU", "GB", "IL", "US"],
      "audience": { "@type": "Audience", "audienceType": "Air passengers who experienced flight disruption" }
    }
    </script>

    <!-- Structured Data — FAQ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How much can I claim for a delayed or cancelled flight?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Up to €600 per passenger under EU Regulation 261/2004, £520 under UK261, or ₪3,530 under Israeli aviation law — depending on your flight distance and disruption type. These amounts are set by regulation and are unrelated to your ticket price."
          }
        },
        {
          "@type": "Question",
          "name": "How far back can I claim flight compensation?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Up to 6 years in England and Wales, 5 years in Scotland and France, 4 years in Israel, and 3 years in most EU countries from the date of the disrupted flight. Flights from 2022 and 2023 may still be within the window."
          }
        },
        {
          "@type": "Question",
          "name": "What does no win, no fee mean for flight compensation?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You never pay anything upfront or out of pocket. ClaimVelo's 30% fee is only deducted from the compensation we recover for you. If we don't win, you owe us absolutely nothing."
          }
        },
        {
          "@type": "Question",
          "name": "What flights qualify for compensation under EU261?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Flights departing any EU airport, or flights arriving in the EU on an EU-based airline. You may claim if your flight was delayed 3 or more hours, cancelled with less than 14 days notice, or you were denied boarding due to overbooking."
          }
        },
        {
          "@type": "Question",
          "name": "How long does a flight compensation claim take?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Most airlines settle within 2–8 weeks. If the airline disputes the claim, escalation to authorities or court can take 3–6 months. ClaimVelo handles everything — you just wait for the payment."
          }
        }
      ]
    }
    </script>
